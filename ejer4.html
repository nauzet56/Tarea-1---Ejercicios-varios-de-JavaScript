<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer4 js</title>
</head>
<body>
    <button id="btnHora">HOLA,hora</button>
   <p id="resultado">dale al boton donde pone HOLA,hola para mostrar la hora </p>
   <script>
        const boton = document.getElementById("btnHora");
        const resultado = document.getElementById("resultado");

        boton.addEventListener("click", function() {
            
            const ahora = new Date();
            
            
            const hora = ahora.toLocaleTimeString();
          
            resultado.innerHTML = hora;
        });
    </script>
</body>
</html>
