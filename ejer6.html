<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer6 js</title>
</head>
<body>
    <input type="number" id="num1" placeholder="numero1">
    <span> + </span>
    <input type="number" id="num2" placeholder="numero2">
    <button id="boton">Sumar</button>
    <p id="resultado">Introduce dos números y pulsa sumar.</p>
    <script>
        const resultado = document.getElementById("resultado");
        const boton = document.getElementById("boton");

        boton.addEventListener("click", function() {
const a = Number(document.getElementById("num1").value)
const b = Number(document.getElementById("num2").value)
let suma = a + b
         resultado.innerHTML = "La suma es:" + suma;
        });

    </script>
</body>
</html>
